# SPDX-License-Identifier: AGPL-3.0-or-later
# Oscairn plugin release configuration.
#
# The ONE place holding this repo's release facts. When copying this release setup to
# another Oscairn plugin fork, edit only this file; check_deps.py, licenses.sh,
# release_conf.py and selfcheck.py stay generic (build.sh, version.py and manifest.py
# have cargo branches).
#
# KEY=VALUE, one per line, comments on their own line: sourced by POSIX sh and
# parsed by the Python scripts the same way.

NAME=oscairn-fm
# File stem of each release asset: <NAME>-<platform>.clap

PACKAGE_ID=org.oscairn.fm
PACKAGE_NAME="Oscairn FM"
PACKAGE_SUMMARY="Oscairn's eight-operator FM synthesis instrument."
# SPDX expression, as published in the packages repo.
LICENSE=AGPL-3.0-or-later
# synth | effect | note-effect:
PLUGIN_KIND=synth
# The plugin's own version is the crate version of fm-clap, which its descriptor reads:
PLUGIN_VERSION_FILE=crates/fm-clap/Cargo.toml
# Its id and name are the PLUGIN_ID and PLUGIN_NAME constants in this file:
PLUGIN_SOURCE_FILE=crates/fm-clap/src/ffi.rs
SOURCE_URL=https://github.com/oscairn/fm
# Releases are tagged oscairn-vX.Y.Z:
TAG_PREFIX=oscairn-
# Cargo package producing the cdylib, and its library name (lib<name>.so, .dylib, <name>.dll):
CARGO_PACKAGE=fm-clap
CARGO_LIB=fm_clap
CLAP_VERSION_FILE=third_party/oscairn-clap/rust/clap-headers/clap/version.h
# oscairn-clap is a submodule: its pin is the commit this repo records for the path.
OSCAIRN_CLAP_SUBMODULE=third_party/oscairn-clap
# Licence/notice files the binary needs, as "path=licenses-name" pairs -> licenses/<name>:
LICENSE_FILES="LICENSE=oscairn-fm-LICENSE third_party/oscairn-clap/LICENSE=oscairn-clap-LICENSE third_party/oscairn-clap/rust/clap-headers/LICENSE=clap-LICENSE third_party/clap-sys/LICENSE-MIT=clap-sys-LICENSE"
