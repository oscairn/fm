name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-arm64, os: ubuntu-24.04-arm, unix: true }
          - { name: linux-x86_64, os: ubuntu-24.04, unix: true }
          - { name: macos-arm64, os: macos-latest, unix: true }
          - { name: windows-x86_64, os: windows-2022, unix: false }
    env:
      CARGO_TERM_COLOR: always
    # bash everywhere: PowerShell would let a failing first command of a step pass
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Format
        # (our packages: --all would also take the submodule's)
        run: cargo fmt --check -p fm-core -p fm-clap -p fmbench -p fm-nopanic
      - name: Clippy
        run: |
          cargo clippy --locked -p fm-core -p fm-clap -p fmbench --all-targets -- -D warnings
          cargo clippy --locked -p fm-nopanic -- -D warnings
      - name: Test (native back end against scalar, golden render)
        run: cargo test --locked --workspace
      - name: Test (scalar back end as the native one)
        run: cargo test --locked -p fm-core --features scalar
      - name: The core builds without the standard library and links no allocator crate
        if: matrix.name == 'linux-x86_64'
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build --locked -p fm-core --target thumbv7em-none-eabihf
          ! grep -rnE 'extern crate (alloc|std)|alloc::' crates/fm-core/src
      - name: No panic paths in the block path and the shell's audio-thread callbacks
        if: matrix.unix
        run: sh tools/check-no-panic.sh
      - name: The plugin builds and loads (its entry, factory, one instance)
        run: |
          cargo build --locked --release -p fm-clap
          lib=$(ls target/release/libfm_clap.so target/release/libfm_clap.dylib target/release/fm_clap.dll 2>/dev/null | head -n 1)
          python3 tools/load-plugin.py "$lib" || python tools/load-plugin.py "$lib"

  cost:
    name: cost gate (aarch64, callgrind)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Instructions a voice-block against the gates and the baseline
        run: sh tools/cost/cg.sh "$PWD" /tmp/cg check
